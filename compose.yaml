# docker compose up -d, then open http://localhost:7789
services:
  altivola-db:
    image: ghcr.io/altivola/altivola-db:latest
    build: .
    container_name: altivola-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:7789:7789" # localhost only: altivola-db runs queries for whoever can reach it
    volumes:
      - altivola-db-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets Linux reach databases on the host

volumes:
  altivola-db-data:
