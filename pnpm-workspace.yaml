packages:
  - apps/*
  - packages/*

# pnpm only runs install scripts for packages listed here.
allowBuilds:
  esbuild: true
  # Optional native speedups pulled in by testcontainers; not needed.
  cpu-features: false
  ssh2: false
  protobufjs: false

minimumReleaseAgeExclude:
  - react-resizable-panels@4.24.1
