name: Release

# Push a tag like v0.1.0 to publish ghcr.io/altivola/altivola-db and the desktop apps
# (macOS and Windows). Run it by hand to build the desktop apps as workflow artifacts
# without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # The desktop apps, added to the release the image job created. They are not
  # signed by Apple or Microsoft; the updater files are signed with the key in
  # altivola/secrets (altivola-db/release.env) so installed apps can update.
  # One at a time, so each run adds its platform to latest.json in turn.
  desktop:
    needs: image
    if: ${{ !cancelled() && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: altivola/secrets
          token: ${{ secrets.SECRETS_REPO_TOKEN }}
          path: .secrets
      - name: Load the updater key
        run: |
          while IFS='=' read -r key value; do
            value="${value%$'\r'}"
            case "$key" in ''|\#*) continue ;; esac
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < .secrets/altivola-db/release.env
          rm -rf .secrets
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Pick the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the server and the web app
        run: |
          pnpm install --frozen-lockfile
          VERSION="$APP_VERSION" pnpm build
      - name: Set the app version and prepare the sidecar
        run: |
          node -e '
            const fs = require("node:fs")
            const v = process.env.APP_VERSION
            const conf = "apps/desktop/src-tauri/tauri.conf.json"
            const json = JSON.parse(fs.readFileSync(conf, "utf8"))
            json.version = v
            fs.writeFileSync(conf, JSON.stringify(json, null, 2) + "\n")
            const cargo = "apps/desktop/src-tauri/Cargo.toml"
            fs.writeFileSync(cargo, fs.readFileSync(cargo, "utf8").replace(/^version = ".*"/m, `version = "${v}"`))
          '
          node apps/desktop/scripts/prepare.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }} --config {"bundle":{"createUpdaterArtifacts":true}}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          includeUpdaterJson: true
      - name: Add a copy with a fixed name, for the README download links
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = macOS ]; then
            src=$(ls "$bundle"/dmg/*.dmg); name=altivola-db-macos-arm64.dmg
          else
            src=$(ls "$bundle"/nsis/*-setup.exe); name=altivola-db-windows-x64-setup.exe
          fi
          cp "$src" "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber
      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
