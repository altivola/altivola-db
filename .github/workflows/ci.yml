name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - run: pnpm typecheck
      - name: Test (integration tests start Postgres, MySQL, MariaDB, SQL Server, MongoDB and Redis with testcontainers)
        run: pnpm test
      - run: pnpm build
      - name: OpenAPI spec is up to date
        run: pnpm openapi && git diff --exit-code apps/api/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker compose build
      - name: The image starts and answers
        run: |
          docker run -d --name adb -p 127.0.0.1:7789:7789 ghcr.io/altivola/altivola-db:latest
          for i in $(seq 1 30); do curl -sf http://localhost:7789/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:7789/ | grep -q altivola-db-token
          docker exec adb altivola-db conn add t postgres://localhost/app
          docker exec adb altivola-db conn list | grep -q postgres
          docker exec adb pg_dump --version
